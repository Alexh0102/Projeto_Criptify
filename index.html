<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta name="bingbot" content="index, follow" />
    <meta
      name="description"
      content="CriptoVéu: privacidade local no navegador para proteger arquivos, mensagens, links e imagens com mais controle."
    />
    <link rel="canonical" href="https://www.criptoveu.com/" />
    <meta property="og:site_name" content="CriptoVéu" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="CriptoVéu | Criptografia local de arquivos e mensagens"
    />
    <meta
      property="og:description"
      content="Proteja arquivos, mensagens, links, QR Codes e imagens com ferramentas locais no navegador."
    />
    <meta property="og:url" content="https://www.criptoveu.com/" />
    <meta name="theme-color" content="#0EE38D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CriptoVéu" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>CriptoVéu | Criptografia local de arquivos e mensagens</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('criptify-theme');
          var theme;

          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            theme = 'light';
          } else {
            theme = 'dark';
          }

          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <main class="seo-fallback">
        <h1>CriptoVéu: criptografia local de arquivos e mensagens</h1>
        <p>
          Proteja arquivos, mensagens, links, QR Codes e imagens com ferramentas locais no navegador.
        </p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
